name: Push containers to registries

on:
  workflow_dispatch:
    inputs:
      container_name:
        description: Name of container to rebuild
        required: true

jobs:
  push_docker_containers:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout pull request branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main

      - name: Setup up docker buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to ghcr.io with docker
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{github.repository_owner}}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to quay.io with docker
        uses: docker/login-action@v4
        with:
          registry: quay.io
          username: ${{ vars.QUAYIO_USERNAME }}
          password: ${{ secrets.QUAYIO_TOKEN }}

      - name: Log in to docker.io with docker
        uses: docker/login-action@v4
        with:
          registry: docker.io
          username: ${{ vars.DOCKERIO_USERNAME }}
          password: ${{ secrets.DOCKERIO_TOKEN }}

      - name: Build and push docker containers
        uses: docker/build-push-action@v7
        with:
          context: ${{ github.event.inputs.container_name }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ github.event.inputs.container_name }}:latest
            quay.io/${{ vars.QUAYIO_USERNAME }}/${{ github.event.inputs.container_name }}:latest
            docker.io/${{ vars.DOCKERIO_USERNAME }}/${{ github.event.inputs.container_name }}:latest
          outputs: type=image,compression=zstd,push=true
